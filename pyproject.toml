[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-route-agent"
version = "0.2.0"
description = "Constraint-aware Singapore route planning with bounded replanning"
requires-python = ">=3.11"
dependencies = [
  "networkx>=3.4,<4", "pydantic>=2.7,<3", "httpx>=0.27,<1",
  "python-dotenv>=1,<2", "openai>=1.48,<3", "shapely>=2,<3",
  "osmnx==2.1.1", "pyproj>=3.6,<4", "streamlit==1.64.0", "folium>=0.16,<1",
  "streamlit-folium>=0.25,<1", "tzdata>=2024.1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
