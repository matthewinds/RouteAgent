[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fyp-route-agent"
version = "0.2.0"
description = "Constraint-aware Singapore route planning with bounded replanning"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3", "httpx>=0.27,<1",
  "python-dotenv>=1,<2", "openai>=1.48,<3", "shapely>=2,<3",
  "pyproj>=3.6,<4", "streamlit==1.64.0", "folium>=0.16,<1",
  "streamlit-folium>=0.25,<1", "tzdata>=2024.1", "gtfs-realtime-bindings>=3,<4",
  "geopandas>=1,<2", "pyogrio>=0.13,<1", "pillow>=12,<13"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["route_agent"]
